function buildFocus(){const wrap=div({});if(!STATE.shortlist.length){const em=div({className:"empty-state"});em.appendChild(p_({style:{fontSize:"15px"}},"No shortlist yet."));const gb=btn({className:"empty-btn"},"Go to Full View →");gb.addEventListener("click",()=>setState({mode:"review"}));em.appendChild(gb);return em}wrap.appendChild(p_({className:"hint"},"Drag to reorder · Tap ● to complete"));const list=div({id:"focus-list"});const taskMap=Object.fromEntries(STATE.tasks.map(t=>[t.id,t]));STATE.shortlist.forEach(tid=>{const task=taskMap[tid];if(!task)return;const dot=CAT_COLORS[task.cat]||"#94a3b8";const done=STATE.completed.has(task.id);const card=div({className:"card focus-card"+(done?" done":""),dataset:{dragId:String(task.id)},draggable:"true"});card.addEventListener("touchstart",e=>touchStart(e,task.id),{passive:false});card.addEventListener("touchmove",touchMove,{passive:false});card.addEventListener("touchend",touchEnd);card.addEventListener("dragstart",e=>{deskDragId=task.id;e.dataTransfer.effectAllowed="move"});card.addEventListener("dragover",e=>{e.preventDefault();card.classList.add("over")});card.addEventListener("dragleave",()=>card.classList.remove("over"));card.addEventListener("drop",e=>{e.preventDefault();card.classList.remove("over");if(deskDragId===task.id)return;const arr=[...STATE.shortlist];const fi=arr.indexOf(deskDragId),ti=arr.indexOf(task.id);arr.splice(fi,1);arr.splice(ti,0,deskDragId);setState({shortlist:arr})});card.addEventListener("dragend",()=>deskDragId=null);card.appendChild(span({className:"drag-handle"},"⠿"));const cb=div({className:"checkbox"+(done?" checked":""),dataset:{checkboxId:String(task.id)}});if(done)cb.appendChild(span({className:"check-mark"},"✓"));cb.addEventListener("click",async()=>{
